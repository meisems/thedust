<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ponsweep — sweep dust tokens on Robinhood Chain into $SWEEP or burn them."
    />
    <meta name="theme-color" content="#00D084" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://rpc.mainnet.chain.robinhood.com https://robinhoodchain.blockscout.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2300D084'/%3E%3Cpath d='M21.5 8.5l-6 6' stroke='%23FBFBFA' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M15.8 14.2l-5.4 2.5a2 2 0 0 0-.6 3.2l1.9 1.9a2 2 0 0 0 3.2-.6l2.5-5.4z' fill='%23FBFBFA'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Sora:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web@2.0.0/dist/umd/phosphor.js"></script>
    <title>ponsweep — $SWEEP</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0b0f;
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ds-theme");
          if (t !== "dark" && t !== "light") {
            t = "dark";
          }
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#0b0b0f" : "#faf9f7");
          document.documentElement.style.backgroundColor = t === "dark" ? "#0b0b0f" : "#faf9f7";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
